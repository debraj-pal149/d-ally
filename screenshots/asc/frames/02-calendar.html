<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
        <link rel="stylesheet" href="frame.css?v=7" />
  <style>
    .shot {
      background:
        radial-gradient(ellipse 80% 50% at 85% 12%, rgba(44, 212, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 60% 40% at 5% 90%, rgba(216, 238, 69, 0.08), transparent 50%),
        linear-gradient(180deg, #0c1a21 0%, #081217 100%);
    }
  </style>
</head>
<body>
  <div class="shot">
    <div class="copy">
      <p class="eyebrow">Your month</p>
      <h1>Your calendar</h1>
      <p class="lede">See which days you kept.</p>
    </div>
    <span class="orbit orbit-a" aria-hidden="true"></span>
    <span class="orbit orbit-b" style="color:#d8ee45;background:#d8ee45" aria-hidden="true"></span>
    <div class="device-wrap">
      <figure class="phone">
        <img src="../../../website/assets/app-calendar.png" alt="" />
      </figure>
    </div>
  </div>
</body>
</html>
